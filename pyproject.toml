[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "data-mind"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<1", "uvicorn>=0.52,<1", "pydantic>=2.13,<3", "numpy>=1.26", "python-multipart>=0.0.20"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
voice = ["faster-whisper>=1.1", "kokoro>=0.9", "soundfile>=0.13", "python-multipart>=0.0.20"]
rag = ["sentence-transformers==6.2.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["apps.voice*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["reference"]
