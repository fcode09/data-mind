[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "data-mind"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "psycopg[binary,pool]>=3.2", "mcp>=1.10", "httpx>=0.28", "numpy>=1.26"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
voice = ["faster-whisper>=1.1", "kokoro>=0.9", "soundfile>=0.13", "python-multipart>=0.0.20"]
rag = ["sentence-transformers>=3.4"]
[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["data_mind*", "apps*"]
[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
